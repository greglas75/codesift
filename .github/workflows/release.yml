# Publish codesift-mcp to npm via OIDC Trusted Publishing — no tokens, no OTP.
#
# npm killed bypass-2FA write tokens (May 2026) and classic tokens (Dec 2025),
# so interactive `npm publish` + 2FA or THIS workflow are the only paths.
# Trusted publishing exchanges a short-lived OIDC credential between GitHub
# Actions and npm — nothing long-lived to leak, provenance attached for free.
#
# One-time setup on npmjs.com (package codesift-mcp → Settings → Trusted
# Publisher): GitHub Actions / owner `greglas75` / repository `codesift` /
# workflow `release.yml` (environment: leave empty).
#
# Release flow afterwards:
#   npm version patch   (bumps package.json + creates the vX.Y.Z tag)
#   git push --follow-tags
# → this workflow builds, tests (prepublishOnly), and publishes.

name: release

on:
  push:
    tags:
      - 'v*'

# Serialize publishes. Two tag pushes a few hours apart produced two publish
# jobs for the same package running CONCURRENTLY for 2h47m (runs 30764086526
# and 30771240657, 2026-08-02) because each was stuck for its full 6h. Never
# cancel-in-progress here: killing a publish mid-upload is worse than queuing.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The native core (ADR-006), built once per platform package under npm/. A failed or missing build
  # does NOT stop the release: publish-native-packages.mjs only lists the platforms that published,
  # and users elsewhere get the TypeScript path, as before the core existed.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: darwin-arm64, os: macos-14 }
          # Cross-compiled on Apple silicon: Intel macOS runners are being retired.
          - { tag: darwin-x64, os: macos-14, target: x86_64-apple-darwin }
          # 22.04 rather than latest: the binary links the runner's glibc, and an older one keeps it
          # loadable on more distributions.
          - { tag: linux-x64-gnu, os: ubuntu-22.04 }
          - { tag: linux-arm64-gnu, os: ubuntu-22.04-arm }
          - { tag: win32-x64-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # rustup is preinstalled and honours rust-toolchain.toml (1.99.0).
      - name: Add the cross target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the addon
        shell: bash
        run: node scripts/build-native.mjs ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tag }}
          path: native/codesift-core.${{ matrix.tag }}.node
          if-no-files-found: error

  publish:
    needs: native
    # Runs even if some native builds failed — see the comment on the `native` job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Backstop ABOVE the in-step ceiling below. Without any timeout this job
    # inherits GitHub's hard 6h cap: five consecutive runs (30588161669,
    # 30669964374, 30764086526, 30771240657, 30833981938) each burned exactly
    # 21615s — 30 hours of runner wall-clock — before being killed.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC credential for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: prepublishOnly runs `npm test`, and
          # scripts/journal-citation-check.ts grounds citations against
          # `git log --all`. A shallow clone (the default) only has HEAD, so
          # every historical SHA reads as ungrounded and the journal-citation
          # test fails — exactly what blocked the v0.9.10 publish. Same fix as
          # test.yml.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm CLI (OIDC support landed in 11.5+).
      - run: npm install -g npm@latest

      - run: npm ci

      # The tree-sitter WASM grammars are NOT committed (see scripts/download-wasm.ts),
      # but `npm run build` — invoked by the prepublishOnly hook below — copies
      # src/parser/languages into dist. Without this step the build fails with
      # `cp: cannot stat 'src/parser/languages'` and the publish never happens
      # (this is exactly why v0.9.6–v0.9.9 never reached npm).
      - name: Download WASM grammars
        run: npm run download-wasm

      # Guard: the pushed tag must match package.json — a mismatched tag
      # publishing the wrong version is worse than a failed run.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # Platform packages first, so the main package's optionalDependencies (written by this step,
      # only for the ones that published) never point at a version that does not exist. Trusted
      # publishing needs each @codesift/core-* package to exist and trust this workflow — the one-time
      # bootstrap is in docs/release-native.md.
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
      - name: Publish native platform packages
        run: node scripts/publish-native-packages.mjs --artifacts native-artifacts

      # prepublishOnly runs `npm run build && npm test` — the same gate as a
      # local publish, so CI cannot ship an untested build. That also means
      # this single step inherits the test suite's hang: all five recent
      # releases wedged HERE, not in the registry upload (step 8 of runs
      # 30588161669 / 30669964374 / 30764086526 / 30771240657 / 30833981938
      # each ran ~6h before the platform killed it).
      #
      # Bound it IN the step so a wedge reports conclusion=failure with a
      # reason, instead of conclusion=cancelled with none. Killing here is
      # safe: the wedge is in prepublishOnly (build+test), long before any
      # bytes reach the registry, and the registry PUT itself is atomic —
      # there is no partial-publish state to land in.
      #
      # 20m in-step < 30m job backstop, so the in-step guard always wins and
      # the job-level ceiling only covers a wedged runner/agent.
      - name: Publish to npm
        run: |
          set +e
          timeout -k 30s 20m npm publish
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "### Publish timed out" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`npm publish\` did not finish within 20m and was killed." >> "$GITHUB_STEP_SUMMARY"
            echo "prepublishOnly (\`npm run build && npm test\`) is the usual culprit — check the \`test\` workflow first." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$rc"
