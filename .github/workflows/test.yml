name: test

# GitHub-hosted CI (public repo → free minutes; NOT self-hosted — a self-hosted
# runner would execute arbitrary fork-PR code as a docker-group user).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The full suite directly exercises node:sqlite, which exists from
        # Node 22.5. Node 20 compatibility is kept in runtime fallbacks; it
        # cannot execute the SQLite-specific test modules themselves.
        node: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history (not the default shallow fetch-depth: 1). scripts/
          # journal-citation-check.ts grounds citations against `git log --all`
          # — a shallow clone only has HEAD, so every historical SHA/date in
          # tests/fixtures/journal/citation-golden.md reads as "ungrounded"
          # (Grounded: 0/20 instead of 15/20). This repo is small (~60MB .git),
          # so a full clone costs negligible extra CI time.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Plain `npm ci` (matches release.yml). The package's own postinstall runs
      # `node ./dist/cli.js setup all`, but dist/ does not exist yet at install
      # time, so its `2>/dev/null || echo` fallback makes it a harmless no-op —
      # while dependency install scripts (native binaries) still run.
      - name: Install dependencies
        run: npm ci

      # tree-sitter WASM grammars are NOT committed (see scripts/download-wasm.ts);
      # cache them so we don't re-npm-install every run. Keyed on the script so a
      # grammar-set change busts the cache.
      - name: Cache tree-sitter WASM grammars
        uses: actions/cache@v6
        with:
          path: src/parser/languages
          key: wasm-${{ runner.os }}-${{ hashFiles('scripts/download-wasm.ts') }}

      - name: Download WASM grammars
        run: npm run download-wasm

      # `npm run build` = rm dist + tsc (full typecheck + emit) + copy the WASM
      # grammars into dist + chmod the bins. Validates the exact artifact the
      # release publishes, and the tsc pass is the typecheck (npm run lint).
      - name: Build
        run: npm run build

      # vitest forces CODESIFT_DISABLE_LOCAL_EMBEDDINGS=true in vitest.config.ts
      # (onnxruntime crashes in vitest's VM), so no ~100MB embedding model is
      # fetched — BM25 + tree-sitter symbol paths are exercised.
      # Bound the suite IN the step, not only via job-level `timeout-minutes`.
      # A job-level timeout CANCELS the job, and a cancelled run reports
      # conclusion=cancelled — visually identical to the concurrency
      # cancel-in-progress above. That made a hard, reproducible hang look like
      # routine cancellation noise: every `test` run from 2026-08-02 to
      # 2026-08-04 sat on this 20-minute ceiling (measured job wall-clock
      # 20m15s / 20m16s / 20m21s on runs 30952083762 / 30931994622 /
      # 30917683856) and every one of them is filed as "cancelled", so nothing
      # ever went red. Last genuinely green run was 30527580133 (2026-07-30),
      # where the same step finished in 2m54s and 3m21s.
      #
      # `testTimeout: 15000` in vitest.config.ts does NOT cover this — the stall
      # is at the pool/teardown level (output goes silent after the last file
      # completes and no test is ever reported as failing), which per-test
      # timeouts cannot bound. Only a wall-clock guard catches it.
      #
      # Exit 1 on 124/137: a hanging test suite is a real failure, not an
      # advisory finding. Every other status is passed through unchanged so
      # ordinary test failures keep their existing meaning.
      - name: Test
        run: |
          set +e
          timeout -k 30s 15m npm test
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "### Test suite timed out" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`npm test\` did not finish within 15m and was killed." >> "$GITHUB_STEP_SUMMARY"
            echo "This is a hang, not a slow suite — the job-level ceiling is 20m." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$rc"
