# The bundled SQLite (libsqlite3-sys) is the one the native store hands to every `node:sqlite` caller
# (ADR-006 stage 1), so it must accept the same SQL node's does. These are the SQL-visible build options
# node:sqlite has and libsqlite3-sys's bundle does not — found by diffing `PRAGMA compile_options`.
# tests/native/sqlite-compat-parity.test.ts fails without them (`ln()`: "no such function").
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_MATH_FUNCTIONS -DSQLITE_ENABLE_PERCENTILE -DSQLITE_ENABLE_GEOPOLY"
SQLITE_MAX_VARIABLE_NUMBER = "250000"
