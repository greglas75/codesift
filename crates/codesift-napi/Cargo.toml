[package]
name = "codesift-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Node-API binding for codesift-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
codesift-core = { path = "../codesift-core" }
# `tokio_rt`: extraction runs as an async fn on tokio's blocking pool, NOT on libuv's four threads —
# those also serve every fs.readFile/stat the indexer does, and a parse holding one starved them.
# `napi6`: BigInt and own-property-name enumeration, which the `node:sqlite` port binds with.
napi = { version = "3", features = ["tokio_rt", "napi6"] }
tokio = { version = "1", features = ["rt"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
