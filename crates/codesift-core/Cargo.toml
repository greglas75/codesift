[package]
name = "codesift-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CodeSift core: storage, search and parsing, independent of Node"

[dependencies]
# `bundled`: SQLite is compiled in, so the core never depends on whatever libsqlite3 a host has.
# Same on-disk format as node:sqlite's bundled copy — rule 1 of ADR-006 (no format change).
rusqlite = { version = "0.40", features = ["bundled"] }
# `raw_value`: the `extras` column's values are copied as raw JSON text (see `write_extras`), so
# the JS side's JSON.parse sees exactly the text the TypeScript path parses.
serde_json = { version = "1", features = ["raw_value"] }

# BM25 (stage 2): the comment and import patterns of bm25.ts, and substring search for centrality.
regex = "1"
memchr = "2"

# Parsing (stage 3). EXACT versions on purpose: the trees must be the ones web-tree-sitter builds —
# the runtime matches web-tree-sitter 0.26.11 and the grammars are the versions the shipped .wasm
# files were built from (verified by hash; see download-wasm.ts). Bump together with those.
tree-sitter = "=0.26.11"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
rayon = "1"

[dev-dependencies]
tempfile = "3"
